    output_dir: "/Volumes/SSD/Projects/newsletter-platform/markets/wasatch/build/drafts"

schedule:
  timezone: "America/New_York"
  slots:
    monday-morning:
      weekdays: [0]
      hour: 3
      minute: 0
      tasks: ["alexandria.collect", "wasatch.collect", "newport.collect", "alexandria.curate", "wasatch.curate", "newport.curate", "alexandria.publish", "wasatch.publish", "newport.publish", "alexandria.seo", "wasatch.seo", "newport.seo", "alexandria.images", "newport.images", "wasatch.images"]
    tuesday-seo:
      weekdays: [1]
      hour: 3
      minute: 0
      tasks: ["alexandria.publish", "wasatch.publish", "newport.publish", "alexandria.seo", "wasatch.seo", "alexandria.images", "newport.images", "wasatch.images"]
    wednesday-review:
      weekdays: [2]
      hour: 3
      minute: 0
      tasks: ["alexandria.collect", "wasatch.collect", "newport.collect", "alexandria.curate", "wasatch.curate", "newport.curate", "alexandria.write", "wasatch.write", "newport.write", "alexandria.publish", "wasatch.publish", "newport.publish", "alexandria.seo", "wasatch.seo", "alexandria.images", "newport.images", "wasatch.images"]
    thursday-seo:
      weekdays: [3]
      hour: 3
      minute: 0
      tasks: ["alexandria.publish", "wasatch.publish", "newport.publish", "alexandria.seo", "wasatch.seo", "alexandria.images", "newport.images", "wasatch.images"]
    friday-seo:
      weekdays: [4]
      hour: 3
      minute: 0
      tasks: ["alexandria.publish", "wasatch.publish", "newport.publish", "alexandria.seo", "wasatch.seo", "alexandria.images", "newport.images", "wasatch.images"]
    saturday-seo:
      weekdays: [5]
      hour: 3
      minute: 0
      tasks: ["alexandria.publish", "wasatch.publish", "newport.publish", "alexandria.seo", "wasatch.seo", "alexandria.images", "newport.images", "wasatch.images"]
    sunday-seo:
      weekdays: [6]
      hour: 3
      minute: 0
      tasks: ["alexandria.publish", "wasatch.publish", "newport.publish", "alexandria.seo", "wasatch.seo", "alexandria.images", "newport.images", "wasatch.images"]

ollama:
  host: "http://localhost:11434"
  model: "gemma4:26b"
  # Per-task kill switch, not a budget for the whole slot. alexandria's
  # curate measured 64m44s over 2,756 rows on 2026-08-22, which exceeded
  # the previous 3000s and would have been killed mid-run.
  timeout: 7200
alerts:
  enabled: true
  env_file: "/Volumes/SSD/Projects/newsletter-platform/markets/alexandria/.env"

logging:
  level: "INFO"
  dir: "/Volumes/SSD/Projects/schedule-tool/logs"
  retention_days: 30

runner:
  lock_file: "/Volumes/SSD/Projects/schedule-tool/scheduler.lock"
  ledger_file: "/Volumes/SSD/Projects/schedule-tool/run_ledger.jsonl"
  lock_stale_seconds: 21600
