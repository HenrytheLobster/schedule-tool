    write_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_alexandria_write.py"
    publish_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_alexandria_publish.py"
    seo_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_alexandria_seo.py"
    images_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_alexandria_images.py"
    output_dir: "/Volumes/SSD/Projects/newsletter-platform/markets/alexandria/build/drafts"

  newport:
    display_name: "Newport Newsletter"
    repo_path: "/Volumes/SSD/Projects/newsletter-platform"
    collect_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_newport_collect.py"
    curate_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_newport_curate.py"
    write_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_newport_write.py"
    publish_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_newport_publish.py"
    seo_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_newport_seo.py"
    images_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_newport_images.py"
    output_dir: "/Volumes/SSD/Projects/newsletter-platform/markets/newport/build/drafts"

  wasatch:
    display_name: "Wasatch Newsletter"
    repo_path: "/Volumes/SSD/Projects/newsletter-platform"
    collect_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_wasatch_collect.py"
    curate_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_wasatch_curate.py"
    write_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_wasatch_write.py"
    publish_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_wasatch_publish.py"
    seo_script: "/Volumes/SSD/Projects/schedule-tool/tasks/run_wasatch_seo.py"
